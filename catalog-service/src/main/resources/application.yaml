server:
  port: 8082
  address: ${SERVER_ADDRESS:127.0.0.1}

spring:
  application:
    name: catalog-service
  datasource:
    # Значения по умолчанию подходят для локального docker-compose.
    # В других средах переопределяются переменными окружения.
    url: ${CATALOG_DB_URL:jdbc:postgresql://localhost:5433/catalog_db}
    username: ${CATALOG_DB_USER:catalog_app}
    password: ${CATALOG_DB_PASSWORD}
  jpa:
    open-in-view: false          # запросы к БД только внутри сервисного слоя
    hibernate:
      ddl-auto: validate         # схему меняет ТОЛЬКО Flyway, Hibernate лишь проверяет соответствие
    properties:
      hibernate:
        default_batch_fetch_size: 50   # убирает N+1 при загрузке атрибутов списка товаров
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    # P1-9: миграции выполняет владелец БД (catalog_owner), приложение работает под ролью catalog_app.
    # Если переменные не заданы (например, в тестах), берутся учётные данные datasource.
    user: ${CATALOG_MIGRATION_USER:${spring.datasource.username}}
    password: ${CATALOG_MIGRATION_PASSWORD:${spring.datasource.password}}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:127.0.0.1:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
        max.block.ms: 5000

wms:
  outbox:
    enabled: true     # события аудита уходят в Kafka через outbox

management:
  endpoints:
    web:
      exposure:
        include: health,info   # metrics убраны: их никто не читает (при мониторинге вернуть и оставить доступ только ADMIN)
  endpoint:
    health:
      show-details: when-authorized   # не раскрываем детали посторонним

app:
  security:
    jwt:
      # Секрет должен совпадать во всех сервисах и в gateway
      jwks-uri: ${AUTH_JWKS_URI:${AUTH_SERVICE_URL:http://localhost:8081}/.well-known/jwks.json}   # P2-11: публичные ключи auth-service (RS256), общего секрета больше нет
      audience: warehouse-api
      issuer: warehouse-auth