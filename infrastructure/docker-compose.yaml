services:
  postgres:
    image: postgres:18.6
    container_name: warehouse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в infrastructure/.env}
      POSTGRES_DB: postgres
      # P1-9: пароли ролей сервисов; по ним infrastructure/postgres/init/02-roles.sh создаёт <svc>_owner и <svc>_app
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?задайте AUTH_DB_PASSWORD в infrastructure/.env (scripts/generate-db-passwords.ps1)}
      AUTH_MIGRATION_PASSWORD: ${AUTH_MIGRATION_PASSWORD:?задайте AUTH_MIGRATION_PASSWORD в infrastructure/.env (scripts/generate-db-passwords.ps1)}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?задайте CATALOG_DB_PASSWORD в infrastructure/.env (scripts/generate-db-passwords.ps1)}
      CATALOG_MIGRATION_PASSWORD: ${CATALOG_MIGRATION_PASSWORD:?задайте CATALOG_MIGRATION_PASSWORD в infrastructure/.env (scripts/generate-db-passwords.ps1)}
      WAREHOUSE_DB_PASSWORD: ${WAREHOUSE_DB_PASSWORD:?задайте WAREHOUSE_DB_PASSWORD в infrastructure/.env (scripts/generate-db-passwords.ps1)}
      WAREHOUSE_MIGRATION_PASSWORD: ${WAREHOUSE_MIGRATION_PASSWORD:?задайте WAREHOUSE_MIGRATION_PASSWORD в infrastructure/.env (scripts/generate-db-passwords.ps1)}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?задайте INVENTORY_DB_PASSWORD в infrastructure/.env (scripts/generate-db-passwords.ps1)}
      INVENTORY_MIGRATION_PASSWORD: ${INVENTORY_MIGRATION_PASSWORD:?задайте INVENTORY_MIGRATION_PASSWORD в infrastructure/.env (scripts/generate-db-passwords.ps1)}
      REQUEST_DB_PASSWORD: ${REQUEST_DB_PASSWORD:?задайте REQUEST_DB_PASSWORD в infrastructure/.env (scripts/generate-db-passwords.ps1)}
      REQUEST_MIGRATION_PASSWORD: ${REQUEST_MIGRATION_PASSWORD:?задайте REQUEST_MIGRATION_PASSWORD в infrastructure/.env (scripts/generate-db-passwords.ps1)}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?задайте NOTIFICATION_DB_PASSWORD в infrastructure/.env (scripts/generate-db-passwords.ps1)}
      NOTIFICATION_MIGRATION_PASSWORD: ${NOTIFICATION_MIGRATION_PASSWORD:?задайте NOTIFICATION_MIGRATION_PASSWORD в infrastructure/.env (scripts/generate-db-passwords.ps1)}
      AUDIT_DB_PASSWORD: ${AUDIT_DB_PASSWORD:?задайте AUDIT_DB_PASSWORD в infrastructure/.env (scripts/generate-db-passwords.ps1)}
      AUDIT_MIGRATION_PASSWORD: ${AUDIT_MIGRATION_PASSWORD:?задайте AUDIT_MIGRATION_PASSWORD в infrastructure/.env (scripts/generate-db-passwords.ps1)}
      REPORT_DB_PASSWORD: ${REPORT_DB_PASSWORD:?задайте REPORT_DB_PASSWORD в infrastructure/.env (scripts/generate-db-passwords.ps1)}
      REPORT_MIGRATION_PASSWORD: ${REPORT_MIGRATION_PASSWORD:?задайте REPORT_MIGRATION_PASSWORD в infrastructure/.env (scripts/generate-db-passwords.ps1)}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      # для PostgreSQL 18+ данные лежат в подкаталоге версии, монтируем родительский каталог
      - postgres_data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    # Один узел в режиме KRaft (без ZooKeeper), достаточно для разработки.
    # Проверьте актуальный тег образа на hub.docker.com/r/apache/kafka
    image: apache/kafka:4.0.0
    container_name: warehouse-kafka
    restart: unless-stopped
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # адрес для клиентов, запущенных на хосте (сервисы из IntelliJ)
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      # брокер готов принимать клиентов (docker compose ps покажет healthy)
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

volumes:
  postgres_data:
