
server:
  port: 8088
  address: ${SERVER_ADDRESS:127.0.0.1}

spring:
  application:
    name: report-service
  datasource:
    url: ${REPORT_DB_URL:jdbc:postgresql://localhost:5433/report_db}
    username: ${REPORT_DB_USER:report_app}
    password: ${REPORT_DB_PASSWORD}
  flyway:
    enabled: true
    # P1-9: миграции выполняет владелец БД (report_owner), приложение работает под ролью report_app.
    # Если переменные не заданы (например, в тестах), берутся учётные данные datasource.
    user: ${REPORT_MIGRATION_USER:${spring.datasource.username}}
    password: ${REPORT_MIGRATION_PASSWORD:${spring.datasource.password}}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}}   # единое имя KAFKA_BOOTSTRAP, как в остальных сервисах
    consumer:
      group-id: report-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      ack-mode: record

app:
  services:
    auth-url: ${AUTH_SERVICE_URL:http://localhost:8081}
  security:
    jwt:
      jwks-uri: ${AUTH_JWKS_URI:${AUTH_SERVICE_URL:http://localhost:8081}/.well-known/jwks.json}   # P2-11: публичные ключи auth-service (RS256), общего секрета больше нет
      audience: warehouse-api
      issuer: warehouse-auth
  report:
    # Часовой пояс для границ суток в фильтрах from/to
    zone: Europe/Moscow
    kafka:
      movements-topic: wms.stock-movements.v1
      audit-topic: wms.audit.v1

management:
  endpoints:
    web:
      exposure:
        include: health,info
