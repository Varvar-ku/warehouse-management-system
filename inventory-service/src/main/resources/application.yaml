server:
  port: 8084
  address: ${SERVER_ADDRESS:127.0.0.1}

spring:
  application:
    name: inventory-service
  datasource:
    url: ${INVENTORY_DB_URL:jdbc:postgresql://localhost:5433/inventory_db}
    username: ${INVENTORY_DB_USER:inventory_app}
    password: ${INVENTORY_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 50
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    # P1-9: миграции выполняет владелец БД (inventory_owner), приложение работает под ролью inventory_app.
    # Если переменные не заданы (например, в тестах), берутся учётные данные datasource.
    user: ${INVENTORY_MIGRATION_USER:${spring.datasource.username}}
    password: ${INVENTORY_MIGRATION_PASSWORD:${spring.datasource.password}}
  jackson:
    deserialization:
      fail-on-unknown-properties: true   # опечатки в именах полей запроса дают 400, а не молча игнорируются
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:127.0.0.1:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
        max.block.ms: 5000

app:
  security:
    jwt:
      jwks-uri: ${AUTH_JWKS_URI:${AUTH_SERVICE_URL:http://localhost:8081}/.well-known/jwks.json}   # P2-11: публичные ключи auth-service (RS256), общего секрета больше нет
      audience: warehouse-api
      issuer: warehouse-auth
    accept-service-tokens: true   # P1-10: inventory принимает служебные токены request-service (остальные сервисы нет)
    service-token:
      trusted:   # P2-11: чьи служебные токены принимаются и каким публичным ключом они проверяются
        request-service:
          jwks-uri: ${REQUEST_SERVICE_JWKS_URI:${REQUEST_SERVICE_URL:http://localhost:8085}/.well-known/jwks.json}
  services:
    catalog-url: ${CATALOG_SERVICE_URL:http://localhost:8082}
    warehouse-url: ${WAREHOUSE_SERVICE_URL:http://localhost:8083}
    auth-url: ${AUTH_SERVICE_URL:http://localhost:8081}   # проверка исполнителя задания на размещение (M7)
  write-off:
    comment-required-reasons: [ LOST, OTHER ]   # причины, для которых комментарий обязателен
    approval-reasons: [ LOST ]                  # причины, для которых нужно подтверждение администратора
  idempotency:
    in-progress-timeout: 2m                   # «зависший» запрос старше этого срока можно перехватить
    retention: 48h                            # сколько хранить ключи

wms:
  outbox:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info   # metrics убраны: их никто не читает (при мониторинге вернуть и оставить доступ только ADMIN)
  endpoint:
    health:
      show-details: when-authorized