server:
  port: 8085
  address: ${SERVER_ADDRESS:127.0.0.1}

spring:
  application:
    name: request-service
  datasource:
    url: ${REQUEST_DB_URL:jdbc:postgresql://localhost:5433/request_db}
    username: ${REQUEST_DB_USER:request_app}
    password: ${REQUEST_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 50
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    # P1-9: миграции выполняет владелец БД (request_owner), приложение работает под ролью request_app.
    # Если переменные не заданы (например, в тестах), берутся учётные данные datasource.
    user: ${REQUEST_MIGRATION_USER:${spring.datasource.username}}
    password: ${REQUEST_MIGRATION_PASSWORD:${spring.datasource.password}}
  jackson:
    deserialization:
      fail-on-unknown-properties: true   # опечатки в именах полей запроса дают 400
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:127.0.0.1:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
        max.block.ms: 5000

app:
  security:
    public-paths:
      - /.well-known/jwks.json   # P2-11: публичный ключ служебных токенов (через gateway не проброшен)
    service-token:
      # ключ подписи служебных токенов (P1-10) хранится ВНЕ репозитория; профиль dev создаёт его сам
      signing-key-file: ${REQUEST_SERVICE_KEY_FILE}
    jwt:
      jwks-uri: ${AUTH_JWKS_URI:${AUTH_SERVICE_URL:http://localhost:8081}/.well-known/jwks.json}   # P2-11: публичные ключи auth-service (RS256), общего секрета больше нет
      audience: warehouse-api
      issuer: warehouse-auth
  idempotency:
    # Шаблоны путей, где заголовок Idempotency-Key обязателен (фильтр применяется к POST, PUT, PATCH и DELETE).
    # Точный путь без /** относится только к POST создания заявки: PATCH и DELETE идут на /api/v1/requests/{id}.
    required-paths:
      - /api/v1/requests
    in-progress-timeout: 2m   # запись без «сердцебиения» дольше этого считается брошенной
    retention: 24h
  services:
    catalog-url: ${CATALOG_SERVICE_URL:http://localhost:8082}
    warehouse-url: ${WAREHOUSE_SERVICE_URL:http://localhost:8083}
    inventory-url: ${INVENTORY_SERVICE_URL:http://localhost:8084}
    auth-url: ${AUTH_SERVICE_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info   # metrics убраны: их никто не читает (при мониторинге вернуть и оставить доступ только ADMIN)
  endpoint:
    health:
      show-details: when-authorized

wms:
  outbox:
    enabled: true