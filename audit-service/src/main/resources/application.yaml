server:
  port: 8086
  address: ${SERVER_ADDRESS:127.0.0.1}

spring:
  application:
    name: audit-service
  datasource:
    url: ${AUDIT_DB_URL:jdbc:postgresql://localhost:5433/audit_db}
    username: ${AUDIT_DB_USER:audit_app}
    password: ${AUDIT_DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
    # P1-9: миграции выполняет владелец БД (audit_owner), приложение работает под ролью audit_app.
    # Если переменные не заданы (например, в тестах), берутся учётные данные datasource.
    user: ${AUDIT_MIGRATION_USER:${spring.datasource.username}}
    password: ${AUDIT_MIGRATION_PASSWORD:${spring.datasource.password}}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:127.0.0.1:9092}
    consumer:
      group-id: audit-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

app:
  security:
    jwt:
      jwks-uri: ${AUTH_JWKS_URI:${AUTH_SERVICE_URL:http://localhost:8081}/.well-known/jwks.json}   # P2-11: публичные ключи auth-service (RS256), общего секрета больше нет
      audience: warehouse-api
      issuer: warehouse-auth

management:
  endpoints:
    web:
      exposure:
        include: health,info
