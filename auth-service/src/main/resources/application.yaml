server:
  port: 8081
  address: ${SERVER_ADDRESS:127.0.0.1}

spring:
  application:
    name: auth-service
  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5433/auth_db}
    username: ${AUTH_DB_USER:auth_app}
    password: ${AUTH_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 50   # роли списка пользователей грузятся пачками, без N+1
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    # P1-9: миграции выполняет владелец БД (auth_owner), приложение работает под ролью auth_app.
    # Если переменные не заданы (например, в тестах), берутся учётные данные datasource.
    user: ${AUTH_MIGRATION_USER:${spring.datasource.username}}
    password: ${AUTH_MIGRATION_PASSWORD:${spring.datasource.password}}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:127.0.0.1:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
        max.block.ms: 5000

app:
  security:
    public-paths:
      - /api/v1/auth/login
      - /api/v1/auth/refresh
      - /api/v1/auth/logout
      - /.well-known/jwks.json   # P2-11: публичные ключи (через gateway не проброшен)
    self-service-password-change: false   # пароли и логины задаёт только администратор
    jwt:
      audience: warehouse-api
      # P2-11: подпись RS256. Приватный ключ хранится ВНЕ репозитория, путь задаёт переменная окружения.
      # Профиль dev создаёт файл ключа сам, если его нет (app.security.jwt.generate-if-missing).
      private-key-file: ${JWT_PRIVATE_KEY_FILE}
      # При смене ключа: публичная часть предыдущей пары остаётся в JWKS на время жизни старых токенов
      # previous-public-key-file: ${JWT_PREVIOUS_PUBLIC_KEY_FILE}
      issuer: warehouse-auth
      ttl: 15m                                  # access-токен короткий (P1-8); сессию продлевает refresh-токен
    refresh:
      ttl: 12h              # срок refresh-токена, продлевается при каждом обновлении
      max-session: 24h      # абсолютный предел сессии от входа, затем нужен новый вход
      reuse-grace: 10s      # повторное предъявление токена в этом окне считается гонкой вкладок, а не кражей
      cookie-secure: true   # false только для доступа по HTTP не с localhost
    login-throttle:
      enabled: true
      pair-max-failures: 5      # неудач подряд для пары логин + IP до блокировки
      pair-base-lock: 30s       # первая пауза, дальше удваивается
      ip-max-failures: 30       # неудач с одного IP (любые логины)
      ip-base-lock: 60s
      max-lock: 15m             # потолок паузы
      reset-after: 15m          # без неудач столько времени, и счётчик обнуляется
  bootstrap-admin:
    login: ${BOOTSTRAP_ADMIN_LOGIN:admin}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}      # без значения по умолчанию
    full-name: Администратор системы

wms:
  outbox:
    enabled: true     # события аудита уходят в Kafka через outbox

management:
  endpoints:
    web:
      exposure:
        include: health,info   # metrics убраны: их никто не читает (при мониторинге вернуть и оставить доступ только ADMIN)
  endpoint:
    health:
      show-details: when-authorized