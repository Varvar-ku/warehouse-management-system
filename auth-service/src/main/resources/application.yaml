server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5433/auth_db}
    username: ${DB_USER:warehouse}
    password: ${DB_PASSWORD:warehouse}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 50   # роли списка пользователей грузятся пачками, без N+1
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  security:
    public-paths:
      - /api/v1/auth/login
    jwt:
      secret: ${JWT_SECRET:}                    # было: ${JWT_SECRET:dev-only-secret-...}
      issuer: warehouse-auth
      ttl: 8h
  bootstrap-admin:
    login: ${BOOTSTRAP_ADMIN_LOGIN:admin}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}      # было: ${BOOTSTRAP_ADMIN_PASSWORD:Admin-2026-dev}
    full-name: Администратор системы

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized