server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Заголовки безопасности. 'unsafe-inline' в style-src нужен Ant Design (стили генерируются в рантайме).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # API: на gateway. Заголовки X-Forwarded-* нужны защите входа (счётчик попыток считается по IP клиента).
    location /api/ {
        proxy_pass ${GATEWAY_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Файлы с хешем в имени кэшируются надолго
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # add_header в location сбрасывает унаследованные, поэтому заголовки безопасности повторены
        add_header X-Content-Type-Options "nosniff" always;
    }

    # index.html не кэшируется: после выпуска пользователь сразу получает новую версию
    location = /index.html {
        add_header Cache-Control "no-store";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
    }

    # SPA: любой неизвестный путь отдаёт index.html, дальше маршрутизирует React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
