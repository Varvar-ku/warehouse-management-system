server:
  port: 8083
  address: ${SERVER_ADDRESS:127.0.0.1}

spring:
  application:
    name: warehouse-service
  datasource:
    url: ${WAREHOUSE_DB_URL:jdbc:postgresql://localhost:5433/warehouse_db}
    username: ${WAREHOUSE_DB_USER:warehouse_app}
    password: ${WAREHOUSE_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 50   # допустимые типы/материалы секций грузятся пачками
        jdbc:
          time_zone: UTC
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:127.0.0.1:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        request.timeout.ms: 5000     # без этих пределов при недоступном брокере отправка outbox ждала бы до минуты
        delivery.timeout.ms: 10000
        max.block.ms: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
    # P1-9: миграции выполняет владелец БД (warehouse_owner), приложение работает под ролью warehouse_app.
    # Если переменные не заданы (например, в тестах), берутся учётные данные datasource.
    user: ${WAREHOUSE_MIGRATION_USER:${spring.datasource.username}}
    password: ${WAREHOUSE_MIGRATION_PASSWORD:${spring.datasource.password}}
  jackson:
    deserialization:
      # Строгий режим: опечатка в имени поля (например, "materal" в условиях правила) иначе молча
      # игнорировалась бы, и правило подошло бы слишком широко. Теперь такой запрос получит 400.
      fail-on-unknown-properties: true

app:
  security:
    jwt:
      jwks-uri: ${AUTH_JWKS_URI:${AUTH_SERVICE_URL:http://localhost:8081}/.well-known/jwks.json}   # P2-11: публичные ключи auth-service (RS256), общего секрета больше нет
      audience: warehouse-api
      issuer: warehouse-auth

wms:
  outbox:
    enabled: true     # события о статусе секции уходят в Kafka через outbox

warehouse:
  placement:
    length-tolerance: 0.5      # допустимая погрешность сравнения размеров, в мм
    default-length-unit: MM    # единица, если у значения она не указана
    length-units:              # единица → коэффициент перевода в мм
      MM: 1
      CM: 10
      M: 1000

management:
  endpoints:
    web:
      exposure:
        include: health,info   # metrics убраны: их никто не читает (при мониторинге вернуть и оставить доступ только ADMIN)
  endpoint:
    health:
      show-details: when-authorized